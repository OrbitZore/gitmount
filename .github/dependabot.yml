# Dependabot: keep GitHub Actions references current.
# CMake FetchContent pins (Catch2, libgit2) are deliberate version pins —
# they are reviewed via docs/maintenance-checklist.md, not auto-bumped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
