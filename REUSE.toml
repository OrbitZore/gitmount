# REUSE.toml — copyright/license annotations for files without in-file
# headers (docs, dotfiles, templates). Source files carry their own tags.
version = 1
SPDX-PackageName = "gitmount"
SPDX-PackageDownloadLocation = "https://github.com/OrbitZore/gitmount"

[[annotations]]
path = [
  "README.md",
  "README.zh-CN.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "CHANGELOG.md",
  "LICENSE",
  "rfc/**",
  "docs/**",
  ".clang-format",
  ".gitignore",
  ".gitattributes",
  ".github/CODEOWNERS",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/ISSUE_TEMPLATE/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The gitmount authors"
SPDX-License-Identifier = "GPL-3.0-or-later"
